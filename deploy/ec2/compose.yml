name: capstone-ec2

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-traffic_urban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate deploy/ec2/.env first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  backend:
    image: capstone-backend-ec2:local
    build:
      context: ../../BE
    restart: unless-stopped
    env_file: ${EC2_ENV_FILE:-.env}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-traffic_urban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate deploy/ec2/.env first}
      SECRET_KEY: ${SECRET_KEY:?Generate deploy/ec2/.env first}
      AUTH_COOKIE_SECURE: "true"
      AUTH_ALLOW_BEARER_LOGIN: "false"
      STORAGE_BACKEND: s3
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:?Set the existing S3 bucket}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX-datasets}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-southeast-1}
      DATASET_UPLOAD_DIR: /app/uploads/datasets
      LAG_FEATURE_MODEL_DIR: /app/artifacts/lag_feature_forests
      FINAL_MODEL_DIR: /app/artifacts/final_models
    command: [/app/.venv/bin/uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000", --proxy-headers, --forwarded-allow-ips, "*"]
    volumes:
      - dataset_uploads:/app/uploads/datasets
      - model_artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/db', timeout=5).read()"]
      interval: 15s
      timeout: 8s
      start_period: 60s
      retries: 5
    logging: *logging

  web:
    image: capstone-web-ec2:local
    build:
      context: ../../FE
      dockerfile: Dockerfile.ec2
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set the public domain or HTTP test address}
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    logging: *logging

volumes:
  postgres_data:
  dataset_uploads:
  model_artifacts:
  caddy_data:
  caddy_config:
