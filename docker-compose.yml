services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: capstone_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "123"
      POSTGRES_DB: traffic_urban
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d traffic_urban"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./BE
      dockerfile: Dockerfile
    container_name: capstone_backend
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - /app/.venv/bin/python -m app.database.local_migrations && exec /app/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - ./BE/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      AUTH_COOKIE_SECURE: "false"
      DATABASE_URL: postgresql://admin:123@postgres:5432/traffic_urban
    ports:
      - "8000:8000"
    volumes:
      - ./BE/app:/app/app
      - ./BE/tests:/app/tests
      - ./BE/migrations:/app/migrations:ro
      - dataset_uploads:/app/uploads/datasets
      - lag_feature_models:/app/artifacts/lag_feature_forests
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/db', timeout=4)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./FE
      dockerfile: Dockerfile
    container_name: capstone_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./FE:/app
      - /app/node_modules

volumes:
  postgres_data:
  dataset_uploads:
  lag_feature_models:
