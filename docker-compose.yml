services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: capstone_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "123"
      POSTGRES_DB: traffic_urban
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d traffic_urban"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./BE
      dockerfile: Dockerfile
    container_name: capstone_backend
    restart: unless-stopped
    env_file:
      - ./BE/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql://admin:123@postgres:5432/traffic_urban
    ports:
      - "8000:8000"
    volumes:
      - ./BE/app:/app/app
      - ./BE/tests:/app/tests
      - dataset_uploads:/app/uploads/datasets
      - lag_feature_models:/app/artifacts/lag_feature_forests
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./FE
      dockerfile: Dockerfile
    container_name: capstone_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./FE:/app
      - /app/node_modules

volumes:
  postgres_data:
  dataset_uploads:
  lag_feature_models:
