[project]
name = "be-app"
version = "0.1.0"
description = "Capstone Urban Traffic Backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14.0",
    "fastapi>=0.115.0",
    "geoalchemy2>=0.17.0",
    "psycopg2-binary>=2.9.10",
    "pydantic-settings>=2.7.0",
    "pydantic>=2.10.0",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008", "BLE001"]
