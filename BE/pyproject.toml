[project]
name = "be-app"
version = "0.1.0"
description = "Capstone Urban Traffic Backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.36",
    "psycopg2-binary>=2.9.10",
    "geoalchemy2>=0.17.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "alembic>=1.14.0",
    "email-validator>=2.3.0",
    "psycopg[binary]>=3.3.6",
    "ijson>=3.6.0",
    "openpyxl>=3.1.5",
    "pyarrow>=26.0.0",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008", "BLE001"]
